<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El campesino y el secreto de la seda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Patrick+Hand&display=swap">
<style>
:root{--bg:#e8edf3;--paper:#f7f9fc;--ink:#1b2438;--muted:#4a5878;--lapis:#2b4a8c;--saffron:#e2a42b;--madder:#a63446;--note:#fbe9b8;--note-ink:#3b2d08;--bubble:#fff;--bubble-ink:#1b2438;--line:#9aa8c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111a2b;--paper:#1b2740;--ink:#eef1f7;--muted:#a9b6d3;--lapis:#8fb0ff;--note:#3a2f14;--note-ink:#fbe9b8;--line:#4a5878}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111a2b;--paper:#1b2740;--ink:#eef1f7;--muted:#a9b6d3;--lapis:#8fb0ff;--note:#3a2f14;--note-ink:#fbe9b8;--line:#4a5878}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1.2rem/1.45 "Patrick Hand","Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.app{max-width:960px;margin:0 auto;padding:14px 16px 28px}
.route{display:flex;align-items:center;margin:4px 0 18px;padding:0 4px}
.route .dash{flex:1;height:0;border-top:3px dashed var(--line)}
.stop{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font-size:1.05rem;display:grid;place-items:center;padding:0}
.stop[aria-current="step"]{background:var(--saffron);color:#1b2438}
.stop.seen{background:var(--lapis);color:#fff}
.cover{text-align:center;padding:12vh 8px 8vh}
.cover h1{font-size:clamp(2.2rem,8vw,4rem);margin-bottom:.4em}
.cover p{color:var(--muted);max-width:30ch;margin:0 auto 1.6em}
.btn{background:var(--saffron);color:#1b2438;border:3px solid #1b2438;border-radius:12px;padding:.55em 1.2em;box-shadow:4px 4px 0 #1b2438;font-size:1.2rem}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b2438}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.page{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:820px){.page{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.frame{position:relative;border:4px solid #1b2438;border-radius:8px;overflow:hidden;box-shadow:7px 7px 0 var(--saffron);background:#000;aspect-ratio:1/1}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.hot{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:3px solid #1b2438;background:#fff;color:#1b2438;font-weight:700;padding:0;display:grid;place-items:center;animation:pulse 2.4s ease-out infinite}
.hot[aria-pressed="true"]{background:var(--saffron);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,164,43,.9)}70%,100%{box-shadow:0 0 0 14px rgba(226,164,43,0)}}
.text{display:flex;flex-direction:column;gap:14px}
.ptitle{font-size:1.5rem}
.nar{background:var(--note);color:var(--note-ink);border:3px solid #1b2438;border-radius:6px;padding:.7em .9em;font-family:Marcellus,Georgia,serif;font-size:1rem;line-height:1.5}
.lines{display:flex;flex-direction:column;gap:18px}
.bw{display:flex;flex-direction:column;max-width:92%}
.bw.l{align-self:flex-start}.bw.r{align-self:flex-end;align-items:flex-end}
.who{font-size:.95rem;font-weight:700;margin:0 6px 2px}
.b{position:relative;background:var(--bubble);color:var(--bubble-ink);border:3px solid #1b2438;border-radius:20px;padding:.55em .9em;animation:pop .28s ease-out}
.b::after{content:"";position:absolute;bottom:-10px;width:16px;height:16px;background:var(--bubble);border:3px solid #1b2438;border-top:0;border-left:0;transform:rotate(45deg)}
.l .b::after{left:22px}.r .b::after{right:22px;transform:rotate(45deg)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.note{border-left:6px solid var(--saffron);background:var(--paper);padding:.5em .8em;border-radius:0 8px 8px 0;font-size:1.05rem}
.note b{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:1.15rem;display:block}
.note.hint{color:var(--muted)}
.nav{display:flex;gap:12px;justify-content:space-between;margin-top:6px}
.end{display:grid;gap:16px;max-width:640px;margin:0 auto}
.end h2{font-size:2rem;text-align:center}
.flips{display:grid;gap:14px}
@media(min-width:620px){.flips{grid-template-columns:1fr 1fr}}
.flip{text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:1em;min-height:9.5em;box-shadow:5px 5px 0 var(--lapis)}
.flip.madder{box-shadow:5px 5px 0 var(--madder)}
.flip h3{font-size:1.3rem;margin-bottom:.4em}
.flip .cl{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const P=[
{t:"Un campesino trabajador",img:1,alt:"Amir, un campesino joven, trabaja la tierra con una azada mientras su familia lo mira.",
 nar:"Amir es un campesino humilde que vive con su familia. Trabaja la tierra de un señor feudal y debe entregarle parte de su cosecha.",
 L:[["Amir","l","«Trabajo desde el amanecer, pero apenas queda alimento para mis hijos»."]],
 H:[[30,72,"Trabajar la tierra","Amir labra la tierra de un señor feudal. Debe entregarle parte de su cosecha."],[84,52,"Su familia","De lo que queda de la cosecha depende el alimento de toda la familia."]]},
{t:"Preparativos para el viaje",img:3,alt:"El mercader Yusuf muestra telas de seda a Amir; al fondo se ve una caravana de camellos.",
 nar:"Yusuf prepara una caravana con seda procedente de Asia, especias y papel. Contrata porteadores, organiza los animales y revisa sus documentos comerciales.",
 L:[["Ayudante","r","«El viaje será largo y tendremos que atravesar territorios gobernados por distintos señores»."],["Yusuf","r","«Por eso necesitamos provisiones, acuerdos y protección»."]],
 H:[[66,45,"Seda de Asia","La seda llegaba desde Asia por las rutas comerciales y era uno de los productos más valiosos de la caravana."],[50,22,"La caravana","Porteadores y animales cargan la mercancía en un viaje largo por territorios de distintos señores."],[84,82,"Especias","Las especias viajaban junto con la seda y el papel."]]},
{t:"El poder de las autoridades",img:2,alt:"Guardias de un puesto de control revisan un documento junto a sacos de mercancía.",
 nar:"En un puesto de control, los guardias exigen el pago de un peaje para permitir el paso de la caravana.",
 L:[["Guardia","l","«Sin pagar el impuesto, no podéis continuar»."],["Yusuf","r","«Las rutas nos permiten comerciar, pero dependemos de quienes controlan los caminos»."]],
 H:[[56,40,"El peaje","Un peaje es un pago que se exige para dejar pasar por un camino. Quien controla el camino tiene poder sobre el comercio."],[44,82,"La mercancía","Los sacos y cargas son lo que la caravana debe proteger y por lo que debe pagar para seguir."]]},
{t:"Un conocimiento nuevo",img:4,alt:"Yusuf le muestra a Amir un manuscrito de papel con dibujos de plantas.",
 nar:"El mercader le muestra a Amir un manuscrito de papel con conocimientos de agricultura y cálculos comerciales. Le explica que el papel se difundió por las rutas comerciales desde China y que el mundo islámico contribuyó a transmitir conocimientos entre distintas regiones.",
 L:[["Mercader","r","«Los libros permiten conservar ideas y compartir descubrimientos»."],["Amir","l","«¡Quizá algún día pueda aprender a leer y mejorar mis cultivos!»."]],
 H:[[46,72,"El manuscrito","Este libro de papel reúne conocimientos de agricultura y cálculos comerciales. Ideas que se pueden conservar y compartir."],[88,35,"El papel","El papel se difundió desde China por las rutas comerciales, y el mundo islámico ayudó a transmitir conocimientos entre regiones."]]},
{t:"Las creencias y el poder",img:5,alt:"Amir conversa con viajeros de distintas culturas frente a una ciudad con mezquita.",
 nar:"Amir observa que los viajeros practican una religión diferente de la de algunos habitantes de la región. Aunque existen diferencias religiosas, el comercio permite el encuentro entre culturas.",
 L:[["Amir","l","«Tenemos costumbres distintas, pero podemos aprender unos de otros»."],["Mercader","r","«Así es, aunque no todos tienen la misma libertad ni las mismas oportunidades»."]],
 H:[[56,24,"Una ciudad de encuentro","En ciudades como esta se cruzaban viajeros y vecinos con costumbres y creencias distintas."],[62,66,"Culturas que se encuentran","El comercio permite que personas diferentes se conozcan y aprendan unas de otras."]]},
{t:"Una reflexión sobre la desigualdad",img:6,alt:"Al atardecer, la caravana se aleja mientras Amir y el mercader la miran.",
 nar:"Cuando la caravana se marcha, Amir regresa a sus labores. Ha descubierto un mundo más amplio, pero sigue sujeto a sus obligaciones.",
 L:[["Amir","l","«El comercio trae ideas y oportunidades, pero los campesinos seguimos trabajando para otros»."],["Mercader","r","«El mundo puede enriquecerse con los intercambios, pero la riqueza y el conocimiento no llegan a todos por igual»."]],
 H:[[68,52,"La caravana se va","La caravana sigue su camino, y Amir vuelve a sus labores y obligaciones."],[85,28,"Un mundo más amplio","Amir descubrió ideas nuevas, aunque su vida sigue atada a lo que debe al señor feudal."]]}
];
const app=document.getElementById("app");
let cur=-1, shown=P.map(()=>0), seen=new Set(), flipped={};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const total=P.length;

function route(){
  let h='<nav class="route" aria-label="Viñetas">';
  P.forEach((p,i)=>{
    h+=(i?'<span class="dash"></span>':'')+`<button class="stop${seen.has(i)&&i!==cur?' seen':''}" data-go="${i}" aria-label="Viñeta ${i+1}: ${esc(p.t)}"${i===cur?' aria-current="step"':''}>${i+1}</button>`;
  });
  return h+'</nav>';
}
function cover(){
  app.innerHTML=`<section class="cover"><h1>El campesino y el secreto de la seda</h1><p>Un cómic para recorrer la Ruta de la Seda viñeta por viñeta.</p><button class="btn" data-go="0">Empezar a leer</button></section>`;
}
function panel(){
  const p=P[cur], n=shown[cur], done=n>=p.L.length;
  seen.add(cur);
  const lines=p.L.slice(0,n).map(([w,s,t])=>`<div class="bw ${s}"><span class="who">${w}</span><div class="b">${t}</div></div>`).join("");
  const hots=p.H.map((h,i)=>`<button class="hot" style="left:${h[0]}%;top:${h[1]}%" data-hot="${i}" aria-pressed="false" aria-label="Más información: ${esc(h[2])}">?</button>`).join("");
  const last=cur===total-1;
  app.innerHTML=route()+`<section class="page"><div class="frame"><img src="${IMG[p.img]}" alt="${esc(p.alt)}">${hots}</div>
  <div class="text"><h2 class="ptitle">Viñeta ${cur+1}. ${p.t}</h2><div class="nar">${p.nar}</div>
  <div class="lines" aria-live="polite">${lines}</div>
  <div class="note hint" id="note" role="status">Toca los signos de pregunta de la imagen para saber más.</div>
  <div class="nav"><button class="btn ghost" data-prev${cur===0?' disabled':''}>Atrás</button><button class="btn" data-next>${done?(last?"Ver reflexión final":"Siguiente viñeta"):"Continuar"}</button></div></div></section>`;
}
function ending(){
  const f=flipped;
  const card=(k,cls,title,hidden,txt)=>`<button class="flip ${cls}" data-flip="${k}" aria-expanded="${!!f[k]}"><h3>${title}</h3>${f[k]?`<span>${txt}</span>`:`<span class="cl">${hidden}</span>`}</button>`;
  app.innerHTML=route()+`<section class="end"><h2>Reflexión final</h2><div class="flips">
  ${card("a","","Lo que se ganó","Toca para descubrirlo","La sociedad medieval ofrecía oportunidades de intercambio cultural y aprendizaje. La Ruta de la Seda conectaba pueblos y conocimientos.")}
  ${card("b","madder","Lo que no llegó a todos","Toca para descubrirlo","Los campesinos tenían poca libertad debido a sus obligaciones, y los beneficios de la Ruta de la Seda se distribuían de manera desigual.")}
  </div><div class="nav"><button class="btn ghost" data-prev>Atrás</button><button class="btn" data-go="restart">Volver a leer</button></div></section>`;
}
function render(){ if(cur<0)cover(); else if(cur>=total)ending(); else panel(); window.scrollTo({top:0}); }
function go(i){ cur=i; if(i>=0&&i<total&&seen.has(i)&&shown[i]===0)shown[i]=P[i].L.length; render(); }
function next(){ if(cur<0||cur>=total)return; if(shown[cur]<P[cur].L.length){shown[cur]++;const y=scrollY;render();scrollTo({top:y});} else go(cur+1); }
function prev(){ if(cur>0)go(cur-1); }
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.go!==undefined){ if(t.dataset.go==="restart"){shown=P.map(()=>0);seen=new Set();flipped={};go(0);} else go(+t.dataset.go); }
  else if("next" in t.dataset) next();
  else if("prev" in t.dataset) prev();
  else if(t.dataset.hot!==undefined){
    const h=P[cur].H[+t.dataset.hot], note=document.getElementById("note"), was=t.getAttribute("aria-pressed")==="true";
    app.querySelectorAll(".hot").forEach(b=>b.setAttribute("aria-pressed","false"));
    if(was){note.className="note hint";note.textContent="Toca los signos de pregunta de la imagen para saber más.";}
    else{t.setAttribute("aria-pressed","true");note.className="note";note.innerHTML="<b>"+h[2]+"</b>"+h[3];}
  }
  else if(t.dataset.flip){ flipped[t.dataset.flip]=!flipped[t.dataset.flip]; ending(); }
});
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("button")&&(e.key===" "||e.key==="Enter"))return;
  if(e.key==="ArrowRight")next(); else if(e.key==="ArrowLeft")prev();
});
let sx=0,sy=0;
app.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
app.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){dx<0?next():prev();}},{passive:true});
render();
</script>
